name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: saasguard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bootstrap backend env
        run: cp .env.example .env

      - name: Bootstrap frontend env
        run: cp frontend/.env.example frontend/.env

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build and start services
        run: docker compose up -d --build

      - name: Show running services
        run: docker compose ps

      - name: Run pytest in API container
        run: docker compose run --rm -v "$PWD:/app" api pytest -v

      - name: Run frontend build
        run: docker compose exec frontend npm run build

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down containers and volumes
        if: always()
        run: docker compose down -v
