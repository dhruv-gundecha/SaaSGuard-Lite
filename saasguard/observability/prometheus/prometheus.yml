global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: saasguard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: saasguard-worker
    static_configs:
      - targets: ["worker:9101"]
        labels:
          service: worker
