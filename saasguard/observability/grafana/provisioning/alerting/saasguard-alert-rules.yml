apiVersion: 1

groups:
  - orgId: 1
    name: saasguard_oe_alerts
    folder: SaaSGuard Alerts
    interval: 1m
    rules:
      - uid: sg_auth_failure_spike
        title: SaaSGuard Authentication Failure Spike
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(saasguard_api_auth_failures_total{job="saasguard-api"}[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: dropNN
                replaceWithValue: 0
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: saasguard-auth-security
        panelId: 1
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Authentication failures exceeded the demo threshold in the last five minutes.
          description: Detects issuer mismatch, audience mismatch, expired-token floods, JWKS validation failures, or token abuse.
          runbook: docs/incident-runbook.md#token-validation-failure-spike
        labels:
          service: saasguard
          severity: critical
          category: authentication

      - uid: sg_authz_denial_spike
        title: SaaSGuard Authorization Denial Spike
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(saasguard_api_authorization_denials_total{job="saasguard-api"}[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: dropNN
                replaceWithValue: 0
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: saasguard-auth-security
        panelId: 2
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Authorization denials exceeded the demo threshold in the last five minutes.
          description: Detects cross-tenant access attempts, privilege escalation attempts, bad membership configuration, or X-Active-Tenant misuse.
          runbook: docs/incident-runbook.md#authorization-denial-spike
        labels:
          service: saasguard
          severity: high
          category: authorization

      - uid: sg_export_failure_spike
        title: SaaSGuard Export Failure Spike
        condition: C
