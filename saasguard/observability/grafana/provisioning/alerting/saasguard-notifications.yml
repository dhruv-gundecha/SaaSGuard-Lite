apiVersion: 1

contactPoints:
  - orgId: 1
    name: saasguard-local-demo
    receivers:
      - uid: saasguard_local_demo_email
        type: email
        disableResolveMessage: false
        settings:
          addresses: demo-alerts@example.invalid

policies:
  - orgId: 1
    receiver: saasguard-local-demo
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
